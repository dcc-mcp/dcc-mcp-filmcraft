[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-filmcraft"
version = "0.1.0"
description = "Typed Core/MCP adapter for owned FilmCraft browser and native engine sessions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["dcc-mcp-core>=0.20.44,<0.21", "mcp>=1.30,<2", "jsonschema>=4.18,<5"]

[project.urls]
Homepage = "https://github.com/dcc-mcp/dcc-mcp-filmcraft"
Documentation = "https://github.com/dcc-mcp/dcc-mcp-filmcraft/blob/main/README.md"
Issues = "https://github.com/dcc-mcp/dcc-mcp-filmcraft/issues"

[project.optional-dependencies]
browser = ["playwright==1.55.0"]
dev = ["pytest>=8", "ruff>=0.8", "build>=1.2", "playwright==1.55.0"]

[project.scripts]
dcc-mcp-filmcraft = "dcc_mcp_filmcraft.cli:main"

[project.entry-points."dcc_mcp.adapters"]
filmcraft = "dcc_mcp_filmcraft:FilmCraftAdapter"

[tool.hatch.build.targets.wheel]
packages = ["python/dcc_mcp_filmcraft"]

[tool.hatch.build.targets.wheel.force-include]
"src/index.js" = "dcc_mcp_filmcraft/assets/index.js"
"src/mcp-bridge.js" = "dcc_mcp_filmcraft/assets/mcp-bridge.js"

[tool.hatch.build.targets.sdist]
only-include = ["python", "src", "skills", "docs", "scripts", "tests", "LICENSE", "README.md", "README.zh-CN.md", "pyproject.toml", "package.json", "package-lock.json", "AGENTS.md"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["python"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
